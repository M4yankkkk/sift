[workspace]
resolver = "2"
members = [
    "crates/sift-core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mayank Tiwari"]
license = "MIT"
repository = "https://github.com/mayank-tiwari/sift"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.14"
walkdir = "2.5"
notify = "6.1"
crossbeam-channel = "0.5"
tantivy = "0.22"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
strip = "debuginfo"

# Vector scoring, image decoding, and tokenization are ~7x slower unoptimized, which made searches in
# `tauri dev` take ~550 ms. Optimize sift-core and all third-party crates even in dev builds; the
# Tauri shell itself stays quick to rebuild.
[profile.dev.package.sift-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Shipped builds: drop symbols and let the linker optimise across crates.
[profile.release]
strip = true
lto = "thin"
