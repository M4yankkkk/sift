name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-checks:
    name: Rust Core Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OCR and PDF tests skip themselves when these tools are missing, so install them
      - name: Install Tesseract and poppler
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy -p sift-core --all-targets -- -D warnings

      - name: Core Tests
        run: cargo test -p sift-core

  frontend-checks:
    name: Frontend Typecheck and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run check

      - name: Vitest Tests
        run: npm test

      - name: Build Web Bundle
        run: npm run build
